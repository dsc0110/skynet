services:

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    environment:
      TZ: ${TZ}
      PIHOLE_UID: ${APOLLO_UID}
      PIHOLE_GID: ${APOLLO_GID}
      FTLCONF_dns_listeningMode: 'all' # If using Docker's default `bridge` network setting the dns listening mode should be set to 'all'
      FTLCONF_dns_piholePTR: 'PI.HOLE'
      FTLCONF_dns_revServers: 'true,${LOCAL_NETWORK},${ROUTER_IP},lan'
      FTLCONF_dns_domain_name: 'lan' # required?
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
    volumes:
      - ${HOMELABSHARE}/pihole/etc/pihole:/etc/pihole
    networks:
      - proxy

  home-assistant:
    container_name: home-assistant
    image: ghcr.io/home-assistant/home-assistant:stable
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    privileged: true
    volumes:
      - ${HOMELABSHARE}/home-assistant/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyACM0
    environment:
      - TZ=${TZ}
      - PUID=${APOLLO_UID}
      - PGID=${APOLLO_GID}

  gitea:
    container_name: gitea
    image: docker.gitea.com/gitea:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    environment:
      - USER_UID=${APOLLO_UID}
      - USER_GID=${APOLLO_GID}
    networks:
      - gitea
    volumes:
      - ${HOMELABSHARE}/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"
      
  gitea-tunnel:
    container_name: gitea-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CODE_TUNNEL_TOKEN}
    networks:
      - internal

networks:
  proxy:
  gitea:
    external: false
  internal:
