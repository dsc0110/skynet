services:
  glances:
    container_name: glances
    image: nicolargo/glances:latest-full
    pid: host
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/lab/share/glances/glances.conf:/glances/conf/glances.conf:ro
      - ${DRIVEFOLDER}:${DRIVEFOLDER}:ro
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=${TZ}
      - GLANCES_OPT=-w
    restart: unless-stopped

  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    user: 1001:1001
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    environment:
      - TZ=${TZ} 
    volumes:
      - ./share/jellyfin/config:/config:rw
      - ./share/jellyfin/cache:/cache:rw
      - ./share/jellyfin/logs:/logs:rw
      - ${DRIVEFOLDER}/media:/localmedia:rw
      - ${HERMESSHARE}/media:/hermesmedia:rw
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
      - /dev/dri:/dev/dri

  transmission:
    container_name: transmission
    image: lscr.io/linuxserver/transmission
    privileged: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    ports:
      - 9091:9091
      - 51413:51413
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=${TZ}
      - VERSION=docker
    volumes:
      - ./share/transmission/config:/config
      - ${DRIVEFOLDER}/torrents:/data/torrents

  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:release
    privileged: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    ports:
      - 7878:7878
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./share/radarr:/config
      - ${DRIVEFOLDER}:/data

  sonarr:
    container_name: sonarr
    image: ghcr.io/hotio/sonarr:release
    privileged: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    ports:
      - 8989:8989
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./share/sonarr:/config
      - ${DRIVEFOLDER}:/data

  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:release
    privileged: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    ports:
      - 6767:6767
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=${TZ}
      - UMASK=002
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./share/bazarr:/config
      - ${DRIVEFOLDER}/media:/data/media

  prowlarr:
    container_name: prowlarr
    image: ghcr.io/hotio/prowlarr:release
    privileged: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: ${DOCKERLOGGING_MAXFILE}
        max-size: ${DOCKERLOGGING_MAXSIZE}
    ports:
      - 9696:9696
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=${TZ}
      - UMASK=002
      - ARGS=
    volumes:
      - ./share/prowlarr:/config:rw